<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">Cyber Frameworks: escolha o modelo pela decisão</title>
  <desc id="d">Uma ficha de matriz de decisão com linhas de frameworks; uma linha está destacada como o modelo escolhido.</desc>
  <rect width="1280" height="340" fill="#f3f0e8"/>
  <rect x="0.5" y="0.5" width="1279" height="339" fill="none" stroke="#17150f"/>
  <g font-family="'Courier New',Courier,monospace" font-size="12" letter-spacing="2" fill="#4a463c" font-weight="700">
    <text x="48" y="44">CYBER FRAMEWORKS / CATÁLOGO DE DECISÃO</text>
    <text x="1232" y="44" text-anchor="end">TLP:CLEAR</text>
  </g>
  <line x1="48" y1="62" x2="1232" y2="62" stroke="#17150f"/>
  <text x="48" y="168" font-family="Georgia,'Times New Roman',serif" font-size="74" font-weight="700" fill="#17150f" letter-spacing="-2">Cyber Frameworks</text>
  <text x="50" y="214" font-family="Georgia,'Times New Roman',serif" font-size="25" font-style="italic" fill="#4a463c">Escolha o modelo pela decisão, não pela popularidade.</text>
  <line x1="50" y1="250" x2="170" y2="250" stroke="#b43c0e" stroke-width="4"/>
  <text x="50" y="290" font-family="'Courier New',Courier,monospace" font-size="11" letter-spacing="2" fill="#4a463c" font-weight="700">PERGUNTA → NATUREZA → LIMITE → EVIDÊNCIA</text>
  <g transform="translate(830 86)">
    <rect width="402" height="212" fill="#fbf9f3" stroke="#17150f"/>
    <g font-family="'Courier New',Courier,monospace" font-size="10" font-weight="700" letter-spacing="2" fill="#4a463c">
      <text x="20" y="26">RECURSO</text><text x="160" y="26">PERGUNTA</text><text x="318" y="26">LIMITE</text>
    </g>
    <line x1="20" y1="36" x2="382" y2="36" stroke="#17150f"/>
    <g fill="#cfc9ba">
      <rect x="20" y="50" width="110" height="6"/><rect x="160" y="50" width="130" height="6"/><rect x="318" y="50" width="64" height="6"/>
      <rect x="20" y="74" width="90" height="6"/><rect x="160" y="74" width="140" height="6"/><rect x="318" y="74" width="50" height="6"/>
    </g>
    <rect x="12" y="92" width="378" height="26" fill="#b43c0e"/>
    <text x="22" y="109" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">ESCOLHIDO: responde à pergunta</text>
    <g fill="#cfc9ba">
      <rect x="20" y="134" width="120" height="6"/><rect x="160" y="134" width="120" height="6"/><rect x="318" y="134" width="58" height="6"/>
      <rect x="20" y="158" width="80" height="6"/><rect x="160" y="158" width="146" height="6"/><rect x="318" y="158" width="44" height="6"/>
    </g>
    <line x1="20" y1="176" x2="382" y2="176" stroke="#17150f"/>
    <text x="20" y="196" font-family="'Courier New',Courier,monospace" font-size="10" fill="#b43c0e" font-weight="700" letter-spacing="2">MAPEAMENTO NÃO É CONFORMIDADE.</text>
  </g>
</svg>
